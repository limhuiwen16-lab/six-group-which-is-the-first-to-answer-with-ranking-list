<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小组抢答器 · 中庸小测验 🎯</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; user-select: none; }

  body {
    height: 100vh;                  /* 固定一屏高度，用 flex 分区 */
    background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
    display: flex; flex-direction: column;
    padding: 16px 20px;
    overflow: hidden;
  }

  /* ===== 顶部：标题 + 提示 ===== */
  .top {
    text-align: center;
    color: #fff;
  }
  h1 { font-size: 30px; text-shadow: 0 3px 8px rgba(0,0,0,.4); }
  .hint { color: rgba(255,255,255,.85); margin-top: 4px; font-size: 17px; }

  /* ===== 中间：状态 + 老师按钮 ===== */
  .middle {
    flex: 1;                        /* 占据中间所有剩余空间 */
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
  }
  .status {
    font-size: 32px; font-weight: bold;
    color: #fff; text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,.4);
    min-height: 44px;
  }

  .controls { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .ctrl-btn {
    border: none; border-radius: 14px; cursor: pointer;
    padding: 14px 28px; font-size: 19px; font-weight: bold; color: #fff;
    box-shadow: 0 5px 15px rgba(0,0,0,.3);
    transition: transform .15s;
  }
  .ctrl-btn:hover:not(:disabled) { transform: translateY(-3px); }
  .btn-right  { background: linear-gradient(135deg, #00b09b, #96c93d); }
  .btn-wrong  { background: linear-gradient(135deg, #ff512f, #dd2476); }
  .btn-next   { background: linear-gradient(135deg, #f7971e, #ffd200); color: #5b3fa0; }
  .btn-clear  { background: linear-gradient(135deg, #b2bec3, #636e72); }
  .btn-right:disabled, .btn-wrong:disabled { opacity: .4; cursor: not-allowed; }

  /* ===== 底部：6 个抢答格子（同一行，方便学生够到）===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);   /* ★ 一行 6 个 */
    gap: 14px;
    width: 100%;
    height: 260px;                            /* 格子整体高度 */
    flex-shrink: 0;
  }

  .cell {
    border: none; border-radius: 20px;
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    color: #fff;
    height: 100%;                             /* ★ 统一高度：撑满整行 */
    transition: transform .15s, box-shadow .15s, filter .3s;
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
  }
  .cell .name { font-size: 26px; font-weight: bold; }
  .cell .pts  { font-size: 20px; background: rgba(255,255,255,.25); padding: 4px 14px; border-radius: 20px; }

  .cell:not(.locked):not(.winner):hover { transform: scale(1.05); }

  /* 六组颜色 */
  .g1 { background: linear-gradient(135deg, #ff6b6b, #ee5253); }
  .g2 { background: linear-gradient(135deg, #feca57, #ff9f43); }
  .g3 { background: linear-gradient(135deg, #1dd1a1, #10ac84); }
  .g4 { background: linear-gradient(135deg, #54a0ff, #2e86de); }
  .g5 { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
  .g6 { background: linear-gradient(135deg, #fd79a8, #e84393); }

  /* 抢到的组 */
  .winner {
    animation: flash .6s ease infinite alternate;
    transform: scale(1.06) !important;
    box-shadow: 0 0 0 6px #fff, 0 0 40px rgba(255,255,255,.8) !important;
    z-index: 10;
  }
  .winner .name::after { content: " 🎉"; }
  @keyframes flash { from { filter: brightness(1); } to { filter: brightness(1.35); } }

  /* 锁定的组 */
  .locked { filter: grayscale(.9) brightness(.45); cursor: not-allowed; }
</style>
</head>
<body>

<!-- ===== 顶部 ===== -->
<div class="top">
  <h1>🎯 小组抢答器</h1>
  <div class="hint">哪一组最快按下，就由哪一组回答！先抢先赢 ⚡</div>
</div>

<!-- ===== 中间：状态 + 老师操作按钮 ===== -->
<div class="middle">
  <div class="status" id="status">请各组准备好……抢答开始！</div>
  <div class="controls">
    <button class="ctrl-btn btn-right" id="btnRight" disabled>✔ 答对 +1 分</button>
    <button class="ctrl-btn btn-wrong" id="btnWrong" disabled>✘ 答错（不扣分）</button>
    <button class="ctrl-btn btn-next" onclick="newRound()">🔄 下一题（解锁抢答）</button>
    <button class="ctrl-btn btn-clear" onclick="resetAll()">🧹 全部清零</button>
  </div>
</div>

<!-- ===== 底部：抢答格子（一行 6 个，学生举手就能按到）===== -->
<div class="grid" id="grid"></div>

<script>
const groupNames = ["第一组", "第二组", "第三组", "第四组", "第五组", "第六组"];
let scores = [0, 0, 0, 0, 0, 0];
let buzzed = -1;          // 抢到的组编号，-1 表示还没人抢
let roundOver = false;    // 本轮是否已结束

const grid    = document.getElementById("grid");
const statusEl = document.getElementById("status");
const btnRight = document.getElementById("btnRight");
const btnWrong = document.getElementById("btnWrong");

// 生成 6 个格子
groupNames.forEach((name, i) => {
  const cell = document.createElement("button");
  cell.className = `cell g${i + 1}`;
  cell.id = "cell" + i;
  cell.innerHTML = `<div class="name">${name}</div><div class="pts" id="pts${i}">⭐ 0 分</div>`;
  cell.onclick = () => buzz(i);
  grid.appendChild(cell);
});

// ===== 抢答逻辑（先按到的组锁定全场，保证公平）=====
function buzz(i) {
  if (buzzed !== -1) return;          // 已有人抢到，忽略其他点击
  buzzed = i;

  document.getElementById("cell" + i).classList.add("winner");
  groupNames.forEach((_, j) => {
    if (j !== i) document.getElementById("cell" + j).classList.add("locked");
  });

  statusEl.textContent = `🎉 ${groupNames[i]} 抢到了！请回答！`;
  btnRight.disabled = false;
  btnWrong.disabled = false;
}

// ===== 老师判分 =====
btnRight.onclick = () => judge(1);
btnWrong.onclick = () => judge(0);    // ★ 答错不扣分，只结束本轮

function judge(delta) {
  if (buzzed === -1 || roundOver) return;
  roundOver = true;

  if (delta === 1) {
    scores[buzzed]++;
    document.getElementById("pts" + buzzed).textContent = `⭐ ${scores[buzzed]} 分`;
    statusEl.textContent = `👍 答对了！${groupNames[buzzed]} +1 分！`;
  } else {
    statusEl.textContent = `💪 没关系，${groupNames[buzzed]} 勇敢尝试就值得鼓励，下一题加油！`;
  }

  btnRight.disabled = true;
  btnWrong.disabled = true;
}

// ===== 下一题：解锁所有格子 =====
function newRound() {
  buzzed = -1;
  roundOver = false;
  groupNames.forEach((_, i) => {
    document.getElementById("cell" + i).classList.remove("winner", "locked");
  });
  statusEl.textContent = "请各组准备好……抢答开始！";
  btnRight.disabled = true;
  btnWrong.disabled = true;
}

// ===== 全部清零 =====
function resetAll() {
  scores = [0, 0, 0, 0, 0, 0];
  groupNames.forEach((_, i) => {
    document.getElementById("pts" + i).textContent = "⭐ 0 分";
  });
  newRound();
}
</script>

</body>
</html>
